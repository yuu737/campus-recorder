<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>流れ B1 押す</title>
<link rel="stylesheet" href="../_shell/shell.css">
<style>
.el{white-space:nowrap}
.full{position:absolute;left:0;top:0;width:1412px;height:1024px;overflow:hidden}
.full img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.capwin{position:absolute;overflow:hidden;background:#fff;border:3px solid var(--ink);box-shadow:8px 8px 0 rgba(0,49,216,.16)}
.capwin img{position:absolute;left:0;top:0;width:1920px;height:1080px}
.zw{position:absolute;left:0;top:0;width:100%;height:100%}
.thumb{position:absolute;width:240px;height:180px;overflow:hidden;border:6px solid #fff;box-shadow:0 6px 16px rgba(14,16,21,.35)}
.thumb img{width:100%;height:100%;object-fit:cover}
.rip{position:absolute;border-radius:50%;border:6px solid var(--acc);box-sizing:border-box;opacity:0}
.steptag{font-size:28px;font-weight:700;color:#fff;background:var(--acc);padding:4px 14px}
</style></head><body><div id="stage"></div>
<script src="../_shell/shell.js"></script>
<script>
const R="../../../../";
FLOW.scene({agent:"staff",
build(F){
  const V=F.V,pg=F.page,o={};const $=(t,c,p,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;(p||pg).appendChild(e);return e};
  // 前半：実写 1 枚
  o.full=$("div","el full");o.pimg=$("img","",o.full);o.pimg.src=R+V.photo.file;
  o.pcap=$("div","el",pg,`<span class="src" style="background:rgba(255,255,255,.85);padding:4px 10px">写真 ${V.photo.id}　${V.photo.label}</span>`);F.place(o.pcap,40,40);
  // 落とす 4 枚（capture の log.json の drop と同じ公開版）
  o.dlab=$("div","el steptag",pg,V.drop.label);F.place(o.dlab,40,706);
  o.thumbs=V.drop.files.map((f,i)=>{const e=$("div","el thumb",pg);F.place(e,40+i*262,760);$("img","",e).src=R+f;return e});
  // 後半：職員の画面（撮った連番の切り出し）
  const C=V.capture,[cx,cy,cw,ch]=C.crop;
  o.pre=$("div","el pre",pg,V.pre);F.place(o.pre,86,70);
  o.win=$("div","capwin el",pg);F.place(o.win,86,170,cw,ch);
  o.zw=$("div","zw",o.win);o.cimg=$("img","",o.zw);o.cimg.style.transform=`translate(${-cx}px,${-cy}px)`;
  o.spots=V.steps.map(s=>{const e=F.spot(o.zw);const tg=$("div","el steptag",o.zw,s.label);const rp=s.click?$("div","rip",o.zw):null;return {s,e,tg,rp}});
  o.cap=F.caption(V.cap);
  o.lastSrc="";
  return o;
},
seek(F,t,o){
  const V=F.V,C=V.capture,[cx,cy]=C.crop;
  const T0=3.6;                       // 後半の始まり（場面の秒）
  const toScene=ct=>T0+(ct-C.from)/C.rate;
  // 前半
  const fa=1-F.eio(F.P(t,T0-.5,.6));
  o.full.style.opacity=fa;o.full.style.display=fa>0?"block":"none";F.kb(o.pimg,t,0,T0,1,1.1,"55% 45%");
  o.pcap.style.opacity=Math.min(F.P(t,.9,.3),fa);
  o.dlab.style.opacity=Math.min(F.P(t,1.1,.25),fa);
  o.thumbs.forEach((e,i)=>{F.rise(e,t,1.35+i*.35,.3,40);e.style.opacity=Math.min(+e.style.opacity,fa)});
  // 後半
  F.rise(o.pre,t,T0-.2,.35,16);F.rise(o.win,t,T0-.4,.45,40);
  const ct=Math.min(C.to,C.from+Math.max(0,t-T0)*C.rate);
  const fi=Math.max(0,Math.min(C.frames-1,Math.round(ct*C.fps)));
  const src=`${R}${C.dir}/f${String(fi).padStart(5,"0")}.jpg`;
  // 画面に寄る（100→110 %、最後の「記録を始める」へ）
  F.kb(o.zw,t,T0,12-T0,1,1.1,V.zoom_origin);
  o.spots.forEach(({s,e,tg,rp})=>{const a=toScene(s.t)-.35;const on=t>=a&&t<a+1.25;
    F.spotAt(e,on?t:a-1,a,{x:s.x-cx-s.w/2,y:s.y-cy-s.h/2,w:s.w,h:s.h},.25,.35);if(!on)e.style.opacity=0;
    F.place(tg,Math.max(80,s.x-cx-s.w/2),s.y-cy-s.h/2-46);/* 寄った時に左で切れない（1.1 倍で 75 px 以上） */tg.style.opacity=on?F.P(t,a,.2):0;
    if(rp){const q=F.P(t,toScene(s.t),.5),d=24+90*F.eo(q);F.place(rp,s.click[0]-cx-d/2,s.click[1]-cy-d/2,d,d);rp.style.opacity=q>0&&q<1?1-q:0}});
  F.rise(o.cap,t,T0+.5,.3,6);
  if(src!==o.lastSrc){o.lastSrc=src;o.cimg.src=src;return o.cimg.decode().catch(()=>{})}
}});
</script></body></html>
