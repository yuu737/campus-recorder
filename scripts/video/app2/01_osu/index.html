<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>アプリ版 B01 職員が押す</title>
<link rel="stylesheet" href="../_shell/app.css">
<style>.win{position:absolute;overflow:hidden;background:#fff;border:3px solid var(--ink);box-sizing:border-box;box-shadow:var(--shadow);z-index:44}</style>
</head><body><div id="stage"></div>
<script src="../_shell/app.js"></script>
<script>
APP.scene({step:"staff",
build(F,S){
  const V=F.V,o={},C=V.cost,PC=V.app.press_crop,k=1242/PC[2];o.k=k;
  // 写真が落ちる（落とした 4 枚＝公開版）
  o.ph=V.drop.files.map((f,i)=>{const e=F.$("div","photo",S);F.$("img","",e).src=F.R+f;return e});
  // 本文：「記録を始める」と費用の上限の欄だけを大きく（職員の画面のコマをそのまま切り出す）。他は暗転
  o.w=F.$("div","win el",S);F.place(o.w,620,206,1242,PC[3]*k);
  const K=V.app.keep;o.keep=F.$("div","",o.w);F.css(o.keep,{position:"absolute"});F.place(o.keep,(K[0]-PC[0])*k,(K[1]-PC[1])*k,K[2]*k,K[3]*k);
  F.ripple(620+(V.app.press[0]-PC[0])*k,206+(V.app.press[1]-PC[1])*k,5.75,{stage:true});
  F.tag("human","写真を入れて、棟の名前を付ける",{x:60,y:540,t0:1.6});
  o.n=F.board("本部棟の写真",60,604,520,190,`<div style="padding:16px 22px 0;white-space:nowrap"><span class="num nn" style="font-size:110px;color:var(--acc)">0</span><span style="font-size:48px;font-weight:700"> 枚</span></div>`);o.nn=o.n.querySelector(".nn");
  F.tag("human","人がする事はこれだけ",{x:620,y:206+PC[3]*k+24,t0:6.2});
  const [cx,cy,cw,ch]=C.inset_crop,ki=1.6;
  o.c=F.board("費用の上限（棟ごと）",620,760,1242,240,`<div style="display:flex;align-items:center;gap:28px;padding:22px 24px 0"><div style="flex:none;width:${cw*ki}px;height:${ch*ki}px;border:3px solid var(--acc);background:url(${F.R+C.inset_src}) ${-cx*ki}px ${-cy*ki}px/${1920*ki}px ${1080*ki}px no-repeat"></div><div class="t28">${C.text}</div></div>`);
  o.cap=F.$("div","el src20",S,"出典 "+V.cap);F.place(o.cap,60,1008);o.cap.style.zIndex=46;
  return o;
},
seek(F,t,o){
  const V=F.V,PC=V.app.press_crop,k=o.k;
  o.ph.forEach((e,i)=>{const [x,y]=F.toStage(410+i*190,640),q=F.eo(F.P(t,.45+i*.08,.45)),s=F.cam.s;
    F.place(e,x,y-200*(1-q),170*s,128*s);e.style.opacity=t<.45+i*.08||t>=1.0?0:1;e.style.transform=`rotate(${(i%2?4:-4)*(1-q)}deg)`});
  F.rise(o.w,t,2.4,.4,30);
  o.w.style.background=`#fff url(${F.R+F.srcAt(t)}) ${-PC[0]*k}px ${-PC[1]*k}px/${1920*k}px ${1080*k}px no-repeat`;
  const a=F.eo(F.P(t,3.0,.4));o.keep.style.boxShadow=`0 0 0 4000px rgba(14,16,21,${.55*a})`;
  F.rise(o.c,t,6.8,.35,24);F.rise(o.n,t,2.6,.35,24);F.countTo(o.nn,V.photos.n,F.eo(F.P(t,2.8,1.2)));
  F.rise(o.cap,t,2.4,.3,6);
}});
</script></body></html>
