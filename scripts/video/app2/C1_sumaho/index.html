<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>締め C1 スマホで歩く</title>
<link rel="stylesheet" href="../_shell/app.css"><link rel="stylesheet" href="../_closing.css">
<style>
.phone{position:absolute;left:300px;top:110px;width:500px;height:884px;background:#16181d;border-radius:64px;box-shadow:14px 14px 0 rgba(0,49,216,.16),0 10px 30px rgba(14,16,21,.3);z-index:45}
.phone .scr{position:absolute;left:20px;top:20px;width:460px;height:844px;border-radius:46px;overflow:hidden;background:#000}
.phone .scr img{position:absolute;left:50%;top:0;height:100%;transform:translateX(-50%)}
.phone .notch{position:absolute;left:50%;top:34px;width:130px;height:30px;margin-left:-65px;background:#16181d;border-radius:20px;z-index:2}
.evl{position:absolute;z-index:47;font-size:30px;font-weight:700;color:#fff;background:var(--ink);padding:6px 16px}
</style>
</head><body><div id="stage"></div>
<script src="../_shell/app.js"></script>
<script>
APP.scene({step:"walk",
build(F,S){
  const V=F.V,o={};
  o.ph=F.$("div","phone",S,`<div class="scr"><img class="a"><img class="b"></div><div class="notch"></div>`);
  o.a=o.ph.querySelector("img.a");o.b=o.ph.querySelector("img.b");o.b.src=F.R+V.end_still.small;
  o.h=F.$("div","el chead",S,`${V.head_lines[0]}<br><span class="a">${V.head_lines[1]}</span>`);F.place(o.h,920,300);
  o.u=F.$("div","el uline",S);F.place(o.u,924,540,820,8);
  o.s=F.$("div","el csub",S,F.esc(V.sub));F.place(o.s,924,580,880);
  o.t=F.tag("code",V.tag.t,{x:924,y:720,t0:3.0});
  o.ev=F.$("div","evl",S,F.esc(V.ev_label));F.place(o.ev,924,800);
  o.cap=F.$("div","el src20",S,"出典 "+V.cap);F.place(o.cap,60,1044-30);o.cap.style.zIndex=46;
  return o;
},
seek(F,t,o){
  const V=F.V,n=Math.min(V.frames.n-1,Math.floor(t*V.frames.fps));
  const src=F.R+V.frames.small.split("（")[0].replace("%04d",String(n).padStart(4,"0"));
  if(o.a.getAttribute("src")!==src){o.a.src=src;o.pend=o.a.decode().catch(()=>{})}
  o.b.style.opacity=F.eo(F.P(t,8.4,.5));
  F.rise(o.ph,t,-.25,.4,40);
  F.rise(o.h,t,.4,.45,30);F.draw(o.u,t,1.0,.6);F.rise(o.s,t,1.4,.35,12);
  F.rise(o.ev,t,8.4,.3,10);
  F.rise(o.cap,t,1.2,.3,6);
}});
const _s=window.seek;window.seek=async t=>{await _s(t);const o=APP.o;if(o&&o.pend)await o.pend;return new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(()=>r(true))))};
</script></body></html>
