<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>締め C2 記録の札</title>
<link rel="stylesheet" href="../_shell/app.css"><link rel="stylesheet" href="../_closing.css">
<style>
.kc{position:absolute;width:400px;height:330px}
.kc .k{font-size:32px;font-weight:700;padding:16px 24px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
.kc .n{padding:26px 24px 0;white-space:nowrap}
.kc .n .num{font-size:124px;color:var(--acc)}
.kc .n .u{font-size:52px;font-weight:700;margin-left:8px}
.kc .s{position:absolute;left:24px;right:20px;bottom:16px;font-family:var(--font-mono);font-size:20px;color:var(--sub);line-height:1.3}
.url{font-family:var(--font-mono);font-size:56px;font-weight:700;white-space:nowrap}
</style>
</head><body><div id="stage"></div>
<script src="../_shell/app.js"></script>
<script>
APP.scene({step:"walk",
build(F,S){
  const V=F.V,o={};
  o.h=F.$("div","el chead",S,V.head.replace(/\[(.+?)\]/g,'<span class="a">$1</span>'));F.place(o.h,120,130);
  o.c=V.cards.map((c,i)=>{const e=F.board("",120+i*430,330,400,330,"");e.classList.add("kc");
    e.innerHTML=`<div class="k">${F.esc(c.k)}</div><div class="n"><span class="num v">0</span><span class="u">${c.u}</span></div><div class="s">${F.esc(c.src)}</div>`;e._v=e.querySelector(".v");e._n=c.n;return e});
  o.url=F.$("div","el url",S,F.esc(V.url));F.place(o.url,120,760);
  o.ul=F.$("div","el uline",S);F.place(o.ul,120,836,1040,8);
  o.us=F.$("div","el csub",S,"コード・記録・決定・テストを、全部公開しています");F.place(o.us,120,862);
  o.cap=F.$("div","el src20",S,"出典 "+V.cap);F.place(o.cap,60,1044-30);o.cap.style.zIndex=46;
  return o;
},
seek(F,t,o){
  F.rise(o.h,t,-.2,.4,24);
  o.c.forEach((e,i)=>{F.rise(e,t,.4+i*.45,.35,30);F.countTo(e._v,e._n,F.eo(F.P(t,.55+i*.45,.8)))});
  F.rise(o.url,t,3.0,.35,16);F.draw(o.ul,t,3.2,.6);F.rise(o.us,t,3.6,.3,10);
  F.rise(o.cap,t,1.0,.3,6);
}});
</script></body></html>
