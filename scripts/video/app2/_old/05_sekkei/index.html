<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>アプリ版 2 B05 設計→製図</title>
<link rel="stylesheet" href="../_shell/app.css">
<style>
.cv.notail::before{display:none}
.df{font-family:var(--font-mono);font-size:36px;line-height:47px;white-space:pre;padding:0 26px}
.df .l{position:relative;padding-left:46px}
.df .l b{position:absolute;left:0;font-weight:700}
.df .m{color:var(--estimated);background:#fff4dc}
.df .p{color:var(--ink);background:#e9ecf3;font-weight:700}
.df .p b{color:var(--acc)}
.df .s{text-decoration:line-through;text-decoration-thickness:2px}
.win{position:absolute;overflow:hidden;background:#fbfaf7;border:3px solid var(--ink);box-sizing:border-box;box-shadow:var(--shadow);z-index:44}
.win img{position:absolute;display:block}
.cr{display:flex;align-items:baseline;justify-content:space-between;padding:8px 24px;border-bottom:2px solid var(--line)}
.cr .k{font-size:30px;font-weight:700}
.cr .n{font-size:64px}
.lab2{position:absolute;font-size:34px;font-weight:700;white-space:nowrap;padding:4px 16px;background:#fff;border:3px solid currentColor;z-index:47}
</style></head><body><div id="stage"></div>
<script src="../_shell/app.js"></script>
<script>
APP.scene({step:"sekkei",
build(F,S){
  const V=F.V,o={},$=(c,h,p)=>F.$("div",c,p||S,h);
  // ── 前半：棟 JSON の差分（本物の行）
  const D=V.diff;
  const rows=D.lines.map(([k,s])=>`<div class="l ${k==="-"?"m":k==="+"?"p":""}"><b>${k===" "?"":k}</b><span class="${k==="-"?"s":""}">${F.esc(s)}</span></div>`).join("");
  o.df=F.board(`${D.path}　<span class="mono" style="font-size:24px;color:var(--sub)">faces[f6].bays.pitch</span>`,620,206,1242,560,
    `<div class="df" style="margin-top:18px">${rows}</div><div class="src20" style="margin:10px 26px 0">出典 git c96f149 → 今の honbu.json（根拠・method の行は略）</div>`);
  o.df.classList.add("el");o.rows=[...o.df.querySelectorAll(".l")];
  o.voice=F.claudeVoice({who:V.voice.agent,model:V.voice.model,took:V.voice.took,text:V.voice.text,src:"pipeline_state_20261108_final.json（設計係の報告）",x:620,y:792,w:1242,t0:3.0,ms:45,tail:false});
  const C=V.counts;
  o.cn=F.board("棟 JSON の値は 3 種類",60,530,520,330,`
    <div class="cr"><span class="k">measured 測った</span><span class="num n c1">0</span></div>
    <div class="cr"><span class="k" style="color:var(--estimated)">estimated 推定</span><span class="num n c2" style="color:var(--estimated)">0</span></div>
    <div class="cr" style="border:0"><span class="k" style="color:var(--unknown)">unknown 不明</span><span class="num n c3" style="color:var(--unknown)">0</span></div>`);
  o.cn.classList.add("el");o.c=[1,2,3].map(i=>o.cn.querySelector(".c"+i));
  o.cs=$("el src20","出典 out/honbu/report.json（counts）");F.place(o.cs,60,866,520);
  o.tg1=F.tag("claude","JSON に書くのは Claude",{x:60,y:910,t0:5.0});
  // ── 後半：本物の立面図 SVG（柱間の寸法線）前 → 後
  const E=V.elev,c=E.crop,ke=1242/c[2];
  o.ew=$("win el");F.place(o.ew,620,262,1242,c[3]*ke);
  const mk=u=>{const d=$("el","",o.ew);F.css(d,{left:0,top:0,width:"1242px",height:(c[3]*ke)+"px",overflow:"hidden"});
    const im=F.$("img","",d);im.src=F.R+u;F.css(im,{left:(-c[0]*ke)+"px",top:(-c[1]*ke)+"px",width:(E.w*ke)+"px"});return d};
  o.eb=mk(E.before);o.ea=mk(E.after);
  o.wipe=$("el","",o.ew);F.css(o.wipe,{top:0,width:"6px",height:"100%",background:"var(--acc)",zIndex:5});
  o.lb=$("lab2 el",`前　${E.before_label}`);o.lb.style.color="var(--estimated)";F.place(o.lb,620,206);
  o.la=$("lab2 el",`後　${E.after_label}`);o.la.style.color="var(--ink)";F.place(o.la,620,206);
  o.es=$("el src20","出典 "+E.source);F.place(o.es,620,262+c[3]*ke+8,1242);
  o.sz=F.board("",620,680,1242,170,`<div style="padding:16px 24px"><div class="t28" style="font-weight:700">${V.seizu.agent} · <span class="mono" style="color:var(--sub)">${V.seizu.model} · ${V.seizu.took}</span></div>
    <div class="mono" style="font-size:32px;margin-top:12px;font-weight:700">${F.esc(V.seizu.cmd)}</div><div class="src20" style="margin-top:12px">出典 ${F.esc(V.seizu.source)}</div></div>`);o.sz.classList.add("el");
  o.tg2=F.tag("code","図面・模型・3D を出すのはコード",{x:620,y:880,t0:8.4});
  return o;
},
seek(F,t,o){
  const V=F.V;
  const out1=1-F.eo(F.P(t,6.6,.4));
  F.rise(o.df,t,2.2,.4,40);o.df.style.opacity*=out1;
  o.rows.forEach((r,i)=>{const k=F.V.diff.lines[i][0];r.style.opacity=k==="+"?F.P(t,2.9+i*.12,.2):1});
  o.voice.el.style.opacity*=out1;
  F.rise(o.cn,t,4.4,.35,30);o.cn.style.opacity*=out1;o.cs.style.opacity=F.P(t,4.7,.3)*out1;
  const C=V.counts;[C.measured,C.estimated,C.unknown].forEach((v,i)=>F.countTo(o.c[i],String(v),F.eo(F.P(t,4.6,.9))));
  o.tg1.el.style.opacity*=out1;
  // 後半
  F.rise(o.ew,t,6.8,.45,40);
  const w=F.eio(F.P(t,8.0,1.0)),W=1242;
  o.ea.style.clipPath=`inset(0 ${(1-w)*100}% 0 0)`;o.wipe.style.left=(w*W-3)+"px";o.wipe.style.opacity=w>0&&w<1?1:0;
  o.lb.style.opacity=F.P(t,7.0,.3)*(1-F.P(t,8.6,.3));o.la.style.opacity=F.P(t,8.7,.3);
  o.es.style.opacity=F.P(t,7.2,.3);
  F.rise(o.sz,t,9.3,.35,30);
}});
</script></body></html>
