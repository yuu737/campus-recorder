<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>アプリ版 2 B10 歩く画面</title>
<link rel="stylesheet" href="../_shell/app.css">
<style>
.cn{position:absolute;left:28px;right:28px;display:flex;align-items:center;gap:20px}
.cn i{flex:none;width:44px;height:44px;border:2px solid var(--ink)}
.cn b{font-family:var(--font-mono);font-size:34px;width:260px}
.cn .num{font-size:96px;margin-left:auto}
.wv{position:absolute;overflow:hidden;background:#000;border:3px solid var(--acc);box-sizing:border-box;box-shadow:var(--shadow);z-index:46;transform-origin:0 0}
.wv img{position:absolute;left:0;top:0;width:100%;height:100%}
.press{position:absolute;z-index:48;font-size:36px;font-weight:700;color:#fff;background:var(--acc);padding:8px 22px;white-space:nowrap}
.intro{position:absolute;left:50%;bottom:96px;z-index:70;background:var(--ink);color:#fff;font-size:48px;font-weight:700;padding:14px 36px;white-space:nowrap;box-shadow:var(--shadow)}
.intro b{color:#9fb4ff}
</style>
</head><body><div id="stage"></div>
<script src="../_shell/app.js"></script>
<script>
APP.scene({step:"walk",
build(F,S){
  const V=F.V,o={},C=V.counts;
  o.ev=F.$("img","",F.lay);o.ev.src=F.R+V.app.over;F.css(o.ev,{position:"absolute",left:"0",top:"0",width:"1920px",height:"1080px"});
  o.wv=F.$("div","wv",S,`<img>`);F.place(o.wv,640,206,1220,686);o.wi=o.wv.querySelector("img");
  o.wl=F.$("div","el src20",S,"歩く画面 web/index.html を撮った連番（そのまま）");F.place(o.wl,640,898);o.wl.style.zIndex=46;
  o.pr=F.$("div","press",S,"「根拠で見る」を押す");F.place(o.pr,1180,236);
  o.t1=F.tag("code",V.tags[0].t,{x:1180,y:300,t0:5.0});
  const rows=[["measured","#3fa34d",C.measured],["estimated","#e8912d",C.estimated],["unknown","#8f969c",C.unknown]];
  o.b=F.board("本部棟の値の数（棟 JSON の全部の値）",60,560,880,400,"");
  o.cn=rows.map(([kk,cc,n],i)=>{const e=F.$("div","cn",o.b,`<i style="background:${cc}"></i><b>${kk}</b><span class="num v">0</span>`);e.style.top=(74+i*106)+"px";e._n=n;e._v=e.querySelector(".v");return e});
  o.r=F.board("測れなかった所は、職員に戻る",980,560,880,400,`<div style="padding:20px 28px 0;white-space:nowrap"><span class="num" style="font-size:140px;color:var(--acc)">${C.requests}</span><span style="font-size:48px;font-weight:700"> 件の撮影依頼</span></div><div class="t32" style="padding:10px 28px 0;font-weight:700">→ 職員の画面へ</div><div class="t28" style="padding:10px 28px 0;color:var(--sub)">${F.esc(C.rest)}</div>`);
  o.t2=F.tag("human",V.tags[1].t,{x:1300,y:966,t0:8.0});
  o.intro=F.$("div","intro",S,V.intro.html);
  F.link({from:V.app.mini.spot,to:o.wv,t0:2.5,box:false});
  o.cap=F.$("div","el src20",S,"出典 "+V.cap);F.place(o.cap,60,1044-30);o.cap.style.zIndex=46;
  return o;
},
seek(F,t,o){
  const V=F.V,W=V.walk,K=W.keys;
  {const a=F.eo(F.P(t,.2,.3))*(1-F.P(t,V.intro.t1,.3));o.intro.style.opacity=a;o.intro.style.transform=`translateX(-50%) translateY(${(1-F.eo(F.P(t,.2,.3)))*20}px)`;}
  // 本文の連番：近づく → 根拠で見る
  let n=K[0][1];for(let i=0;i<K.length;i++){if(t>=K[i][0]){n=K[i][1];if(i+1<K.length&&t<K[i+1][0])n=Math.round(F.lerp(K[i][1],K[i+1][1],(t-K[i][0])/(K[i+1][0]-K[i][0])))}}
  const src=F.R+W.pattern.replace("{n}",String(n).padStart(W.pad,"0"));if(o.wi.getAttribute("src")!==src){o.wi.src=src;o.pend=o.wi.decode().catch(()=>{})}
  F.rise(o.wv,t,2.3,.35,20);
  const sh=F.eio(F.P(t,6.1,.6)),sc=F.lerp(1,.481,sh);  // 縮んで右上へ（本文の下に板を出す場所を空ける）
  o.wv.style.transform=`translate(${F.lerp(0,1220*(1-.481)*1,sh)}px,0) scale(${sc})`;
  o.wl.style.opacity=+o.wv.style.opacity*(1-sh);
  o.ev.style.opacity=F.eo(F.P(t,W.press_at,.3));
  F.pop(o.pr,t,W.press_at-.25);o.pr.style.opacity=+o.pr.style.opacity*(1-F.P(t,6.0,.3));
  o.t1.el.style.opacity=+o.t1.el.style.opacity*(1-F.P(t,6.0,.3));
  if(F.svg)F.svg.style.opacity=1-F.P(t,6.3,.3);
  F.rise(o.b,t,6.5,.35,24);
  o.cn.forEach((e,i)=>{F.rise(e,t,6.7+i*.3,.3,12);e._v.textContent=Math.round(e._n*F.eo(F.P(t,6.8+i*.3,.7)))});
  F.rise(o.r,t,7.4,.35,30);F.pulse(o.r,t,8.9,.6);
  F.rise(o.cap,t,1.2,.3,6);
}});
const _s=window.seek;window.seek=async t=>{await _s(t);const o=APP.o;if(o&&o.pend)await o.pend;return new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(()=>r(true))))};
</script></body></html>
