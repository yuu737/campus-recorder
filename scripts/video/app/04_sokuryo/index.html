<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>アプリ版 B4 測量</title>
<link rel="stylesheet" href="../_shell/app.css">
<style>
.lb{font-size:36px;font-weight:700;white-space:nowrap}
.lb small{display:block;font-size:28px;font-weight:400;margin-top:6px}
.tick{position:absolute;width:6px;height:46px;background:var(--ink)}
</style></head><body><div id="stage"></div>
<script src="../_shell/app.js"></script>
<script>
APP.scene({step:"sokuryo",
build(F,M){
  const V=F.V,o={},$=(t,c,h)=>F.$(t,c,M,h);
  // ① メジャーの写真（公開版）
  o.ph=$("div","el photo");F.place(o.ph,0,190,326,246);o.img=F.$("img","",o.ph);o.img.src=F.R+V.tape.file;
  o.sp=F.$("div","el",o.ph);o.sp.style.border="5px solid var(--acc)";o.sp.style.boxSizing="border-box";
  const s=V.tape.spot,W=310,H=230;F.place(o.sp,s[0]*W,s[1]*H,(s[2]-s[0])*W,(s[3]-s[1])*H);
  o.l1=$("div","el lb",`メジャー ${V.tape.read}<small>タイル ${V.tape.n} 枚分</small>`);F.place(o.l1,0,478);
  o.s1=$("div","el cap",`写真 ${V.tape.photo}（公開版）`);F.place(o.s1,0,570);
  o.op1=$("div","el op",`÷ ${V.tape.n}`);F.place(o.op1,326,290,104);
  // ② タイル 1 枚の幅
  o.b2=$("div","el board2",`<div class="bt">タイル 1 枚の幅</div><svg width="364" height="130" viewBox="0 0 364 130"><g class="tl">${[...Array(7)].map((_,i)=>`<rect x="${12+i*49}" y="14" width="45" height="56" fill="#f2d9a0" stroke="#1a1a1c" stroke-width="2"/>`).join("")}</g><g stroke="#222" stroke-width="3" fill="none"><path d="M12 82V118M57 82V118M12 100H57"/></g><text x="66" y="108" font-size="22" fill="#545861" font-family="BIZ UDPGothic">1 枚</text></svg><div style="padding:0 20px 16px;white-space:nowrap"><span class="num v2" style="font-size:54px">0</span><span style="font-size:34px;font-weight:700"> m</span></div>`);
  F.place(o.b2,430,190,350);o.v2=o.b2.querySelector(".v2");o.tl=o.b2.querySelector(".tl");
  o.op2=$("div","el op",`× ${V.count.n}`);F.place(o.op2,780,290,130);
  // ③ 1 枚ずつ数えた枚数
  o.b3=$("div","el board2",`<div class="bt">印を付けて数えた枚数</div><div class="tk" style="position:relative;height:118px;margin:12px 18px"></div><div style="padding:0 20px 12px"><span class="num v3" style="font-size:64px">0</span><span style="font-size:40px;font-weight:700"> 枚</span></div>`);
  F.place(o.b3,910,190,358);o.v3=o.b3.querySelector(".v3");
  const tk=o.b3.querySelector(".tk");o.ticks=[];
  for(let i=0;i<V.count.n;i++){const e=F.$("div","tick",tk);F.place(e,(i%23)*13.6,Math.floor(i/23)*62);o.ticks.push(e)}
  o.c1=$("div","el cap",`${V.count.photos[0]} → ${V.count.n}<br>${V.count.photos[1]} → ${V.count.n}`);F.place(o.c1,910,512);
  o.ok=$("div","el tagm","2 枚の写真で一致");F.place(o.ok,910,580);
  // ＝ 柱間
  o.eq=$("div","el",`<svg width="1268" height="10"><path d="M0 5H1268" stroke="#1a1a1c" stroke-width="3"/></svg>`);F.place(o.eq,0,640);
  o.eqs=$("div","el op","＝");F.place(o.eqs,0,690,60);
  o.rl=$("div","el lb","柱間");F.place(o.rl,70,712);
  o.res=$("div","el",`<span class="num vr" style="font-size:140px">0</span><span style="font-size:60px;font-weight:700"> ${V.result.unit}</span>`);F.place(o.res,170,668);o.vr=o.res.querySelector(".vr");
  o.tol=$("div","el",`<span class="num" style="font-size:46px">± ${V.result.tol} m</span>`);F.place(o.tol,968,690);
  o.mt=$("div","el tagm",V.result.status);F.place(o.mt,972,758);
  o.ul=$("div","el",`<svg width="690" height="12"><path d="M0 6H690" stroke="#0031d8" stroke-width="8"/></svg>`);F.place(o.ul,170,836);
  return o;
},
seek(F,t,o){
  const V=F.V;
  F.rise(o.ph,t,4.3,.4,30);F.pop(o.sp,t,4.75);F.rise(o.l1,t,4.9);F.rise(o.s1,t,5.1,.3,8);
  F.pop(o.op1,t,5.45);
  F.rise(o.b2,t,5.65,.35,30);o.tl.style.clipPath=`inset(0 ${(1-F.eio(F.P(t,5.85,.7)))*100}% 0 0)`;F.countTo(o.v2,V.tile.value,F.eo(F.P(t,6.0,.9)));
  F.pop(o.op2,t,7.05);
  F.rise(o.b3,t,7.25,.35,30);
  let k=0;o.ticks.forEach((e,i)=>{const on=t>=7.45+i*.03;e.style.opacity=on?1:0;if(on)k=i+1});o.v3.textContent=k;
  F.rise(o.c1,t,8.95,.3,8);F.pop(o.ok,t,9.35);
  F.rise(o.eq,t,9.8,.2,0);F.draw(o.eq,t,9.8,.5);
  F.pop(o.eqs,t,10.0);F.rise(o.rl,t,10.1);F.rise(o.res,t,10.15,.3,20);F.countTo(o.vr,V.result.value,F.eo(F.P(t,10.15,1.1)));
  F.rise(o.tol,t,11.3);F.pop(o.mt,t,11.6);
  [[o.ph,12.4],[o.b2,12.7],[o.b3,13.0]].forEach(([e,a])=>F.pulse(e,t,a,.45));
  o.ul.style.opacity=1;F.draw(o.ul,t,13.1,.4);
}});
</script></body></html>
