<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>アプリ版 B9 歩く画面</title>
<link rel="stylesheet" href="../_shell/app.css">
</head><body><div id="stage"></div>
<script src="../_shell/app.js"></script>
<script>
APP.scene({step:"walk",
build(F,M){
  const V=F.V,o={},$=(t,c,h)=>F.$(t,c,M,h),C=V.counts;
  o.a=$("div","el board2",`<div class="bt">根拠で見る（色）</div>`);F.place(o.a,0,180,620,400);
  o.lg=V.legend.map(([c,k,l],i)=>{const sw=k==="hypothesis"?`background:repeating-linear-gradient(45deg,${c} 0 9px,#fff 9px 16px)`:`background:${c}`;
    const e=F.$("div","el",o.a,`<span style="display:inline-block;width:64px;height:40px;vertical-align:middle;border:2px solid #1a1a1c;${sw}"></span><span style="margin-left:18px;font-family:var(--font-mono);font-size:30px;font-weight:700">${k}</span><span class="t26" style="margin-left:14px">${l}</span>`);F.place(e,24,76+i*76);return e});
  o.b=$("div","el board2",`<div class="bt">本部棟の値の数（棟 JSON）</div>`);F.place(o.b,660,180,608,400);
  o.cn=[["measured",C.measured,"var(--measured)"],["estimated",C.estimated,"var(--estimated)"],["unknown",C.unknown,"var(--unknown)"]].map(([k,n,c],i)=>{const e=F.$("div","el",o.b,`<span style="font-family:var(--font-mono);font-size:28px;font-weight:700;color:${c};display:inline-block;width:200px">${k}</span><span class="num v" style="font-size:72px">0</span>`);F.place(e,28,80+i*100);e._n=n;e._v=e.querySelector(".v");return e});
  o.c=$("div","el board2",`<div class="bt">足りない所は、職員に戻る</div><div style="padding:18px 26px 0;white-space:nowrap"><span class="num" style="font-size:72px;color:var(--acc)">${C.requests}</span><span style="font-size:36px;font-weight:700"> 件の撮影依頼</span><span class="t30" style="margin-left:26px">「どの面を、どこから」撮るか → 職員の画面へ</span></div>`);F.place(o.c,0,618,1268,200);
  return o;
},
seek(F,t,o){
  F.rise(o.a,t,4.3,.35,30);o.lg.forEach((e,i)=>F.rise(e,t,4.6+i*.35,.3,12));
  F.rise(o.b,t,6.0,.35,30);o.cn.forEach((e,i)=>{F.rise(e,t,6.3+i*.4,.3,12);e._v.textContent=Math.round(e._n*F.eo(F.P(t,6.4+i*.4,.8)))});
  F.rise(o.c,t,8.2,.35,30);
  F.pulse(o.c,t,10.0,.5);
}});
</script></body></html>
