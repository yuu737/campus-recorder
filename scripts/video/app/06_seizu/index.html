<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>アプリ版 B6 製図・模型係</title>
<link rel="stylesheet" href="../_shell/app.css">
</head><body><div id="stage"></div>
<script src="../_shell/app.js"></script>
<script>
APP.scene({step:"seizu",
build(F,M){
  const V=F.V,o={},$=(t,c,h)=>F.$(t,c,M,h),E=V.elev,iw=772,ih=Math.round(iw*E.h/E.w);
  o.a=$("div","el board2",`<div class="bt">${E.label}（棟 JSON から生成）</div><div style="position:relative;width:${iw}px;height:${ih}px;margin:12px;overflow:hidden;background:#fff"><img src="${F.R+E.file}" style="width:100%;height:100%"></div>`);F.place(o.a,0,180,800,ih+80);o.img=o.a.querySelector("img");
  o.b=$("div","el board2",`<div class="bt">線の色＝根拠</div>`);F.place(o.b,840,180,428,300);
  o.lg=V.legend.map(([c,s,n,l],i)=>{const e=F.$("div","el",o.b,`<svg width="70" height="20" style="vertical-align:middle"><path d="M2 10H68" stroke="${c}" stroke-width="7" ${s==="dash"?'stroke-dasharray="12 7"':""}/></svg><span class="t30" style="margin-left:14px;font-weight:700;color:${c}">${n}</span><span class="t26" style="margin-left:10px">${l}</span>`);F.place(e,24,78+i*70);return e});
  o.c=$("div","el board2",`<div class="bt">同じ JSON から出る物</div><div class="pl" style="padding:20px 20px 0"></div>`);F.place(o.c,840,520,428,250);
  o.pl=V.outs.map(n=>F.$("span","pill",o.c.querySelector(".pl"),n));
  return o;
},
seek(F,t,o){
  F.rise(o.a,t,4.3,.35,30);F.kb(o.img,t,4.6,6,1,1.12,"35% 40%");
  F.rise(o.b,t,5.4,.35,30);o.lg.forEach((e,i)=>F.rise(e,t,5.7+i*.4,.3,12));
  F.rise(o.c,t,7.4,.35,30);o.pl.forEach((e,i)=>F.pop(e,t,7.7+i*.18));
  F.pulse(o.b,t,10.0,.5);
}});
</script></body></html>
