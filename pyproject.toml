[project]
name = "campus-recorder"
version = "0.1.0"
description = "写真から根拠付きの設計図と歩ける3Dキャンパスを起こす道具（Built with Claude: Japan 2026）"
requires-python = ">=3.13"
dependencies = ["numpy", "pillow"]

[project.optional-dependencies]
dev = ["pytest"]
agents = ["claude-agent-sdk"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["recorder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "blender: Blender 5.2（環境変数 BLENDER）を起動する。CI では外す",
    "browser: headless の Edge / Chrome を起動する。CI では外す",
    "gpu: torch・学習済みの重み（Depth Pro・ALIKED/LightGlue・GeoCalib）が要る。CI では外す",
]
