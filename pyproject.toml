[project]
name = "campus-recorder"
version = "0.1.0"
description = "写真から根拠付きの設計図と歩ける3Dキャンパスを起こす道具（Built with Claude: Japan 2026）"
requires-python = ">=3.13"
dependencies = ["numpy", "pillow"]

[project.optional-dependencies]
dev = ["pytest"]
agents = ["claude-agent-sdk"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["recorder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
