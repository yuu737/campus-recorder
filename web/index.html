<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>キャンパスを歩く</title>
<style>
  :root { --ink:#1b2430; --bg:#dfe7ee; --panel:rgba(255,255,255,.92); --accent:#e0702a; --gray:#9aa3ab; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif; touch-action:none; -webkit-user-select:none; user-select:none; }
  canvas#view { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .panel { position:fixed; background:var(--panel); border-radius:10px; padding:8px 10px; font-size:13px; line-height:1.5;
    box-shadow:0 1px 6px rgba(0,0,0,.25); }
  #legend { top:max(10px, env(safe-area-inset-top)); left:10px; max-width:calc(100vw - 20px); }
  #legend b { font-size:14px; }
  .sw { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-1px; margin-right:5px; }
  #jump { margin-top:4px; display:flex; gap:6px; flex-wrap:wrap; }
  #jump button { font:inherit; padding:4px 10px; border:1px solid #b9c3cc; border-radius:14px; background:#fff; color:var(--ink); }
  #card { right:10px; bottom:max(10px, env(safe-area-inset-bottom)); width:min(230px, calc(100vw - 20px)); display:none; }
  .touch #card { bottom:210px; right:10px; }
  #card h3 { margin:0 0 2px; font-size:15px; }
  #card .k { color:#52606d; }
  #msg { left:50%; bottom:20px; transform:translateX(-50%); text-align:center; width:max-content; max-width:calc(100vw - 20px); pointer-events:none; }
  #stick { position:fixed; left:max(18px, env(safe-area-inset-left)); bottom:max(26px, env(safe-area-inset-bottom)); width:120px; height:120px;
    border-radius:50%; background:rgba(255,255,255,.35); border:2px solid rgba(255,255,255,.8); display:none; touch-action:none; }
  #knob { position:absolute; left:40px; top:40px; width:40px; height:40px; border-radius:50%; background:rgba(40,50,60,.65); }
  .touch #stick { display:block; }
  .touch #msg { bottom:160px; }
  .noui .panel, .noui #stick { display:none !important; }
  #evbtn { margin-top:6px; font:inherit; padding:4px 10px; border:1px solid #b9c3cc; border-radius:14px; background:#fff; color:var(--ink); }
  #evbtn.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  #evlegend { display:none; margin-top:4px; }
  .evmode #evlegend { display:block; }
  .sw.hyp { background:repeating-linear-gradient(45deg, #f2c94c 0 3px, #8a6d12 3px 5px); }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); font-size:16px; z-index:5; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="loading">読み込み中…</div>
<div id="legend" class="panel">
  <b>キャンパスを歩く</b><br>
  <span class="sw" style="background:var(--accent)"></span>根拠付き（measured / estimated）<br>
  <span class="sw" style="background:var(--gray)"></span>未測（PLATEAU の箱）
  <div id="jump"></div>
  <button id="evbtn" type="button">根拠で見る</button>
  <div id="evlegend">
    <span class="sw" style="background:#3fa34d"></span>measured（写真で測った）<br>
    <span class="sw" style="background:#e8912d"></span>estimated（推定。方法あり）<br>
    <span class="sw hyp"></span>仮説（hypothesis）<br>
    <span class="sw" style="background:#8f969c"></span>unknown（まだ分からない）<br>
    <span class="sw" style="background:#5f6266;opacity:.6"></span>面の未撮影の所（被覆図から）<br>
    <span class="sw" style="background:#b8bcc0;opacity:.6"></span>写っているが斜め・遮蔽で使えない所<br>
    <span class="sw" style="background:linear-gradient(90deg,#9e9fa1 0 33%,#dcd5c9 33% 66%,#b7c8a9 66%)"></span>地面の淡い色＝OpenStreetMap 由来の道・歩道・芝（estimated）。濃い灰は根拠なし<br>
    <span class="sw" style="border:2px solid #e8912d"></span>棟 JSON の ground_offset で地面の高さを上書きした帯<br>
    <span class="k" style="color:#52606d">印の無い物は元の色</span>
  </div>
</div>
<div id="card" class="panel"></div>
<div id="msg" class="panel">WASD とドラッグで歩く ／ 棟をクリックで札</div>
<div id="stick"><div id="knob"></div></div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RGBELoader } from "three/addons/loaders/RGBELoader.js";

// URL 引数（比較・調整用）
//   cam=x,y,z,yaw,pitch,fov  視点を固定（x=東, y=北, z=標高 m、yaw は北から時計回り°、pitch は上向き +°、fov は縦の画角°）。
//                            Blender の街路視点の値は out/<id>/model_report.json の web_cameras。歩くと固定は外れる
//   size=1400x1000           描画の大きさを固定（Blender の描画と同じ縦横比で比べる）
//   ui=0                     札や案内を隠す
//   exp=1 env=0.8 sun=2.2    露出・環境光（HDRI）の強さ・太陽の強さ
//   tm=neutral|aces          トーンマッピング（既定 neutral＝Blender の Khronos PBR Neutral と同じ式）
const Q = new URLSearchParams(location.search);
const qnum = (k, d) => { const v = parseFloat(Q.get(k)); return Number.isFinite(v) ? v : d; };
const camQ = (Q.get("cam") || "").split(",").map(Number);
const fixedCam = camQ.length === 6 && camQ.every(Number.isFinite) ? camQ : null;
const sizeQ = (Q.get("size") || "").match(/^(\d+)x(\d+)$/);
if (Q.get("ui") === "0") document.body.classList.add("noui");

const EYE = 1.6, SPEED = 5.0;
const touchDevice = matchMedia("(pointer:coarse)").matches || "ontouchstart" in window;
if (touchDevice) {
  document.body.classList.add("touch");
  document.getElementById("msg").textContent = "左のスティックで移動 ／ 右ドラッグで向き ／ 棟をタップで札";
}

const canvas = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: !!fixedCam });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
// 光：空の HDRI から PMREM で環境光（起動時 1 回）＋ 太陽の平行光（影あり）。Blender の描画（太陽＋空＋影、PBR Neutral）に合わせる
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = Q.get("tm") === "aces" ? THREE.ACESFilmicToneMapping : THREE.NeutralToneMapping;
renderer.toneMappingExposure = qnum("exp", 1.0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfdde8);       // HDRI が読めるまで（読めなければこのまま）
scene.fog = new THREE.Fog(0xcfdde8, 300, 1200);
scene.environmentIntensity = qnum("env", 0.8);
const camera = new THREE.PerspectiveCamera(fixedCam ? fixedCam[5] : 70, 1, 0.1, 2000);
camera.rotation.order = "YXZ";
// 太陽：blender_build の setup_scene と同じ向き（rotation_euler = (48°, 0, -35°)、光は南西の上から北東へ進む）。
// 光の進む向き（データの x=東, y=北, z=上）= (0.426, 0.609, -0.669)。three.js では (x, z, -y)
const SUN_DIR = new THREE.Vector3(0.426, -0.669, -0.609).normalize();
const SUN_DIST = 300, SHADOW_R = 90;                  // 影は視点のまわり ±90 m（2048 px で約 9 cm／画素）
const sun = new THREE.DirectionalLight(0xfff7e6, qnum("sun", 2.2));
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -SHADOW_R, right: SHADOW_R, top: SHADOW_R, bottom: -SHADOW_R, near: 1, far: SUN_DIST * 2 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04;
scene.add(sun); scene.add(sun.target);
function sunFollow(p) {
  sun.target.position.copy(p);
  sun.position.copy(p).addScaledVector(SUN_DIR, -SUN_DIST);
}
async function loadEnv(env) {
  if (!env) return;
  try {
    const hdr = await new RGBELoader().loadAsync(env.url);
    hdr.mapping = THREE.EquirectangularReflectionMapping;
    const pm = new THREE.PMREMGenerator(renderer);
    scene.environment = pm.fromEquirectangular(hdr).texture;
    pm.dispose();
    scene.background = hdr;
    scene.backgroundIntensity = scene.environmentIntensity;
    scene.fog.color.set(0xc9ccd0);
  } catch (e) { console.error("HDRI 読み込み失敗", e); }
}

function resize() {
  let w = innerWidth, h = innerHeight;
  if (sizeQ) {                                         // 決めた大きさ（画面に収まるよう縮める）
    const W = +sizeQ[1], H = +sizeQ[2], k = Math.min(1, innerWidth / W, innerHeight / H);
    w = Math.round(W * k); h = Math.round(H * k);
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
  }
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

const site = await (await fetch("data/site.json")).json();
// 地表の種類のマスク（ground_mask.png：インデックス色。色→種類の番号は G.mask.kinds）を地面の素材に差し込む。
// 1 m 格子の境界は、隣の 4 画素の種類の色を双一次で混ぜてぼかす。根拠モードでは OSM 由来の所を淡い色、根拠の無い所を灰色に
const groundUniforms = { uEv: { value: 0 } };
function groundMaskShader(mat, M, pavTex, tileA, tileP) {
  const mt = new THREE.TextureLoader().load(M.url);
  mt.magFilter = mt.minFilter = THREE.NearestFilter; mt.generateMipmaps = false;
  const pal = M.kinds.map((k) => new THREE.Color().setRGB(...[1, 3, 5].map((i) => parseInt(k.color.slice(i, i + 2), 16) / 255), THREE.SRGBColorSpace));
  const raw = M.kinds.map((k) => new THREE.Vector3(...[1, 3, 5].map((i) => parseInt(k.color.slice(i, i + 2), 16) / 255)));
  Object.assign(groundUniforms, {
    uMask: { value: mt }, uPav: { value: pavTex }, uTileA: { value: tileA }, uTileP: { value: tileP },
    uMaskO: { value: new THREE.Vector2(M.x0, M.y_top - M.h * M.step) }, uMaskStep: { value: M.step },
    uMaskN: { value: new THREE.Vector2(M.w, M.h) },
    uPalRaw: { value: raw }, uPalLin: { value: pal.map((c) => new THREE.Vector3(c.r, c.g, c.b)) },
  });
  const N = M.kinds.length;
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, groundUniforms);
    sh.vertexShader = sh.vertexShader.replace("#include <common>", "#include <common>\nvarying vec3 vGW;")
      .replace("#include <begin_vertex>", "#include <begin_vertex>\nvGW = (modelMatrix * vec4(transformed, 1.0)).xyz;");
    sh.fragmentShader = sh.fragmentShader.replace("#include <common>", `#include <common>
varying vec3 vGW;
uniform sampler2D uMask, uPav; uniform float uTileA, uTileP, uMaskStep, uEv; uniform vec2 uMaskO, uMaskN;
uniform vec3 uPalRaw[${N}], uPalLin[${N}];
int kindOf(vec2 t) {                       // 画素の色 → 種類の番号（パレットの一番近い色）
  vec3 c = texture2D(uMask, (t + 0.5) / uMaskN).rgb; int best = 0; float bd = 1e9;
  for (int i = 0; i < ${N}; i++) { vec3 d = c - uPalRaw[i]; float e = dot(d, d); if (e < bd) { bd = e; best = i; } }
  return best;
}
vec3 kindColor(int k, vec3 a, vec3 p) {    // 0 unknown 1 asphalt 2 paving 3 grass 4 parking 5 steps 6 building
  float l = dot(a, vec3(0.333));
  if (uEv > 0.5) return (k >= 1 && k <= 5) ? mix(uPalLin[k], vec3(1.0), 0.45) : vec3(0.32);
  if (k == 1) return a;
  if (k == 2) return p;
  if (k == 3) return vec3(0.075, 0.16, 0.035) * (0.55 + 2.2 * l);
  if (k == 4) return a * 1.25;
  if (k == 5) return p * 1.25;
  return mix(a, vec3(0.30, 0.28, 0.25), 0.6);
}`).replace("#include <map_fragment>", `
  vec2 wxy = vec2(vGW.x, -vGW.z);
  vec3 tA = texture2D(map, wxy / uTileA).rgb, tP = texture2D(uPav, wxy / uTileP).rgb;
  vec2 q = (wxy - uMaskO) / uMaskStep - 0.5, b = floor(q), f = q - b;
  vec3 gc = kindColor(kindOf(b), tA, tP) * (1.0 - f.x) * (1.0 - f.y) + kindColor(kindOf(b + vec2(1, 0)), tA, tP) * f.x * (1.0 - f.y)
          + kindColor(kindOf(b + vec2(0, 1)), tA, tP) * (1.0 - f.x) * f.y + kindColor(kindOf(b + vec2(1, 1)), tA, tP) * f.x * f.y;
  diffuseColor.rgb *= gc;`);
  };
}
const envReady = loadEnv(site.env);
const G = site.ground;
// データは x=東, y=北, z=標高。three.js は (x, 標高, -北)。glb は最初から この向き。

function groundZ(x, n) {
  const fx = (x - G.x0) / G.step, fy = (n - G.y0) / G.step;
  const i = Math.max(0, Math.min(G.nx - 2, Math.floor(fx))), j = Math.max(0, Math.min(G.ny - 2, Math.floor(fy)));
  const u = Math.max(0, Math.min(1, fx - i)), v = Math.max(0, Math.min(1, fy - j));
  const z = (a, b) => G.z[b * G.nx + a];
  return z(i, j) * (1 - u) * (1 - v) + z(i + 1, j) * u * (1 - v) + z(i, j + 1) * (1 - u) * v + z(i + 1, j + 1) * u * v;
}
{
  const pos = new Float32Array(G.nx * G.ny * 3), idx = [];
  for (let j = 0; j < G.ny; j++) for (let i = 0; i < G.nx; i++) {
    const k = (j * G.nx + i) * 3;
    pos[k] = G.x0 + i * G.step; pos[k + 1] = G.z[j * G.nx + i]; pos[k + 2] = -(G.y0 + j * G.step);
  }
  for (let j = 0; j < G.ny - 1; j++) for (let i = 0; i < G.nx - 1; i++) {
    const a = j * G.nx + i, b = a + 1, c = a + G.nx, d = c + 1;
    idx.push(a, b, c, b, d, c);
  }
  // 地面の 3 段：地表の種類は OSM のマスク（G.mask、1 m 格子、estimated）、建物まわりの段差は棟 JSON の ground_offset（G.overrides）、
  // 残りは 5 m 標高を均した面。質感は CC0 の asphalt・paving_block（UV は m ÷ 1 枚の実寸）、芝は単色。OSM に何も無い所は灰色
  const gt = (site.ground_tex || {}).asphalt, gp = (site.ground_tex || {}).paving_block;
  const tile = gt ? gt.tile_m[0] : 1;
  const uv = new Float32Array(G.nx * G.ny * 2);
  for (let j = 0; j < G.ny; j++) for (let i = 0; i < G.nx; i++) {
    const k = (j * G.nx + i) * 2;
    uv[k] = (G.x0 + i * G.step) / tile; uv[k + 1] = (G.y0 + j * G.step) / tile;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3)); g.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  const gm = new THREE.MeshStandardMaterial({ color: 0x7f7d76, roughness: 0.95 });   // 質感が無い時は Blender の ground と同じ灰色
  if (gt) {
    const tl = new THREE.TextureLoader(), maxAniso = renderer.capabilities.getMaxAnisotropy();
    const tex = (url, srgb) => { const t = tl.load(url); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = maxAniso;
      if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t; };
    gm.color.set(0xffffff); gm.map = tex(gt.color, true); gm.normalMap = tex(gt.normal, false);
    if (G.mask && gp) groundMaskShader(gm, G.mask, tex(gp.color, true), gt.tile_m[0], gp.tile_m[0]);
  }
  const groundMesh = new THREE.Mesh(g, gm);
  groundMesh.receiveShadow = true;                    // 地面は影を受けるだけ
  scene.add(groundMesh);
}

const pickables = [];
const matGray = new THREE.MeshStandardMaterial({ color: 0x9aa3ab, roughness: 0.9 });
const matOn = new THREE.MeshStandardMaterial({ color: 0xe0702a, roughness: 0.9 });
for (const b of site.boxes) {
  const shape = new THREE.Shape(b.footprint.map(([x, n]) => new THREE.Vector2(x, n)));
  const geo = new THREE.ExtrudeGeometry(shape, { depth: (b.height || 10) + 2, bevelEnabled: false });
  geo.rotateX(-Math.PI / 2);   // 形の y(北) → -z、押し出し → 上
  const mesh = new THREE.Mesh(geo, b.grounded ? matOn : matGray);
  mesh.position.y = b.base - 2;
  mesh.userData.info = { id: b.id, name: b.name, grounded: b.grounded, measured: b.measured, estimated: b.estimated, unknown: b.unknown, height: b.height,
                         shape_ratio: b.shape_ratio, evidence_ratio: b.evidence_ratio };
  mesh.castShadow = mesh.receiveShadow = true;
  scene.add(mesh); pickables.push(mesh);
}
// 根拠の層：glb の extras（node / 素材の userData.evidence・face・part）で素材を差し替える。戻すと元の素材
const evRoots = [];
const coverGroup = new THREE.Group();                 // 被覆の重ね（下で作る。根拠モードの時だけ見せる）
coverGroup.visible = false;
const EV_COLOR = { measured: 0x3fa34d, estimated: 0xe8912d, hypothesis: 0xf2c94c, unknown: 0x8f969c };
function stripeMaterial(color) {                      // 仮説：黄の縞（UV に頼らず世界座標の斜めの縞）
  const m = new THREE.MeshStandardMaterial({ color, roughness: 0.9 });
  m.onBeforeCompile = (sh) => {
    sh.vertexShader = sh.vertexShader.replace("#include <common>", "#include <common>\nvarying vec3 vEvW;")
      .replace("#include <begin_vertex>", "#include <begin_vertex>\nvEvW = (modelMatrix * vec4(transformed, 1.0)).xyz;");
    sh.fragmentShader = sh.fragmentShader.replace("#include <common>", "#include <common>\nvarying vec3 vEvW;")
      .replace("#include <color_fragment>", "#include <color_fragment>\nif (fract((vEvW.x + vEvW.y + vEvW.z) * 0.6) < 0.4) diffuseColor.rgb *= 0.45;");
  };
  return m;
}
const EV_MAT = Object.fromEntries(Object.entries(EV_COLOR).map(([k, c]) =>
  [k, k === "hypothesis" ? stripeMaterial(c) : new THREE.MeshStandardMaterial({ color: c, roughness: 0.9 })]));
function evidenceOf(o, mt) {                          // 素材の印（面ごとの壁）＞ 物とその親の印
  if (mt && mt.userData && mt.userData.evidence) return mt.userData.evidence;
  for (let p = o; p; p = p.parent) if (p.userData && p.userData.evidence) return p.userData.evidence;
  return null;
}
// 地面の高さを棟 JSON の ground_offset で上書きした帯（site.json の ground.overrides）：根拠モードの時だけ橙の枠で見せる
const overGroup = new THREE.Group();
overGroup.visible = false;
{
  const lm = new THREE.LineBasicMaterial({ color: 0xe8912d, depthTest: false });
  for (const o of G.overrides || []) {
    if (!o.applied) continue;
    const [x0, y0] = o.from, [x1, y1] = o.to, L = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0) / L, uy = (y1 - y0) / L;
    const nx = uy, ny = -ux, D = o.depth_m;
    const pts = [[0, 0], [L, 0], [L, D], [0, D], [0, 0]].map(([a, d]) => {
      const x = x0 + ux * a + nx * d, n = y0 + uy * a + ny * d;
      return new THREE.Vector3(x, groundZ(x, n) + 0.15, -n);
    });
    const ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lm);
    ln.renderOrder = 3; overGroup.add(ln);
  }
  scene.add(overGroup);
}
let evOn = false;
function setEvidence(on) {
  evOn = on;
  document.body.classList.toggle("evmode", on);
  const btn = document.getElementById("evbtn");
  btn.classList.toggle("on", on); btn.textContent = on ? "元の見た目に戻す" : "根拠で見る";
  coverGroup.visible = on;
  overGroup.visible = on;
  groundUniforms.uEv.value = on ? 1 : 0;
  for (const root of evRoots) root.traverse((o) => {
    if (!o.isMesh) return;
    if (on) {
      if (!o.userData.origMat) o.userData.origMat = o.material;
      const src = o.userData.origMat, arr = Array.isArray(src);
      const swapped = [].concat(src).map((mt) => { const e = evidenceOf(o, mt); return e && EV_MAT[e] ? EV_MAT[e] : mt; });
      o.material = arr ? swapped : swapped[0];
    } else if (o.userData.origMat) {
      o.material = o.userData.origMat;
    }
  });
}
document.getElementById("evbtn").addEventListener("click", () => setEvidence(!evOn));
// 室内の明かり：部屋の中（roomBoxes）にいる間だけ点ける半球光（天井に遮られて日が入らないので真っ暗にならないように）
const roomBoxes = [];
const roomLight = new THREE.HemisphereLight(0xfff6e8, 0x8a7f70, 0);
scene.add(roomLight);
const loader = new GLTFLoader();
const centers = {};
await Promise.all(Object.entries(site.models).map(([id, m]) => new Promise((res) => {
  loader.load(m.url, (gltf) => {
    const root = gltf.scene;
    root.position.y = m.ground_z;     // glb の高さは ground_z 基準
    const d = site.designed[id] || {}, c = d.counts || {};
    const info = { id, name: d.name, grounded: true, measured: c.measured || 0, estimated: c.estimated || 0, unknown: c.unknown || 0,
                   shape_ratio: d.shape_ratio, evidence_ratio: d.evidence_ratio };
    // glb の地形の面（terrain）は隠す。歩く画面の地面は site.json の格子（キャンパス全体）に統一する
    root.traverse((o) => { if (o.isMesh && /^terrain/.test(o.name)) o.visible = false; });
    root.traverse((o) => { if (o.isMesh && o.visible) { o.userData.info = info; pickables.push(o); o.castShadow = o.receiveShadow = true; } });
    // 透けるガラス：glb は alphaMode BLEND（不透明度は Blender の Alpha 0.35）。奥の暗い板（curtain / interior）が透けて見える
    root.traverse((o) => {
      if (!o.isMesh) return;
      for (const mt of [].concat(o.material)) {
        if (!/glass/i.test(mt.name || "")) continue;
        mt.transparent = true;
        mt.opacity = mt.opacity < 1 ? mt.opacity : 0.35;
        mt.depthWrite = false;
        mt.side = THREE.FrontSide;
        mt.envMapIntensity = 2.5;
        o.castShadow = false;
      }
    });
    // 内装（glb の extras.room）：部屋の床と天井の板から部屋の箱を作る（中に入ったら室内の明かりを点ける）
    root.updateMatrixWorld(true);
    const rb = {};
    root.traverse((o) => {
      if (!o.isMesh || !o.userData.room || !/_(floor|ceiling)$/.test(o.userData.part || "")) return;
      (rb[o.userData.room] ||= new THREE.Box3()).expandByObject(o);
    });
    for (const k in rb) roomBoxes.push(rb[k]);
    scene.add(root);
    evRoots.push(root);
    root.updateMatrixWorld(true);
    const bb = new THREE.Box3().setFromObject(root);
    const ct = bb.getCenter(new THREE.Vector3()); ct.y = bb.min.y; centers[id] = ct;
    res();
  }, undefined, (e) => { console.error("glb 読み込み失敗", m.url, e); res(); });
})));

// 被覆の重ね（site export-web --with-coverage）：unknown でない面の、写真の無い所を面の平面に薄い板で重ねる。根拠モードの時だけ見せる。
// 写真そのものは出さない（顔・ナンバー・貼り紙の処理が要るので）。矩形は [along0, along1, z0, z1]（面の from から m、棟の z=0 から m）
{
  const MAT = {
    uncovered: new THREE.MeshBasicMaterial({ color: 0x5f6266, transparent: true, opacity: 0.6, depthWrite: false, side: THREE.DoubleSide,
                                             polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }),
    unusable: new THREE.MeshBasicMaterial({ color: 0xb8bcc0, transparent: true, opacity: 0.55, depthWrite: false, side: THREE.DoubleSide,
                                            polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }),
  };
  for (const d of Object.values(site.designed || {})) {
    if (!d.coverage) continue;
    for (const kind of ["uncovered", "unusable"]) {
      const pos = [];
      for (const f of d.coverage.faces) {
        const [x0, y0] = f.from, [x1, y1] = f.to, L = Math.hypot(x1 - x0, y1 - y0);
        const ux = (x1 - x0) / L, uy = (y1 - y0) / L, nx = uy, ny = -ux, off = 0.08;   // 外向き（面から 8 cm 浮かす）
        const P = (a, z) => [x0 + ux * a + nx * off, d.ground_z + z, -(y0 + uy * a + ny * off)];
        for (const [a0, a1, z0, z1] of f[kind] || []) {
          const A = P(a0, z0), B = P(a1, z0), C = P(a1, z1), D = P(a0, z1);
          pos.push(...A, ...B, ...C, ...A, ...C, ...D);
        }
      }
      if (!pos.length) continue;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
      const mesh = new THREE.Mesh(geo, MAT[kind]);
      mesh.renderOrder = 2;
      coverGroup.add(mesh);
    }
  }
  scene.add(coverGroup);
}

let yaw = 0, pitch = 0;
const player = new THREE.Vector3();
function place(x, z, y) { player.set(x, 0, z); yaw = y; pitch = -0.05; }
const groundAt = (x, z) => groundZ(x, -z);
const jump = document.getElementById("jump");
function addJump(label, id, off) {
  const c = centers[id]; if (!c) return;
  const go = () => place(c.x + off[0], c.z + off[1], Math.atan2(off[0], off[1]));   // 棟の方を向く
  const btn = document.createElement("button"); btn.textContent = label; btn.onclick = go; jump.appendChild(btn);
  return go;
}
const goHonbu = addJump("本部棟へ", "honbu", [-20, 37]);
addJump("タワー75へ", "tower75", [10, 70]);
(goHonbu || (() => place(0, 0, 0)))();
let fixed = null;                                      // ?cam= の固定視点（three.js の座標）
if (fixedCam) {
  const [x, n, z, yawDeg, pitchDeg] = fixedCam;
  fixed = new THREE.Vector3(x, z, -n);
  player.set(x, 0, -n);
  yaw = -yawDeg * Math.PI / 180;                      // three.js の yaw=0 は北（-z）、正で西へ回る
  pitch = pitchDeg * Math.PI / 180;
}

const keys = {};
addEventListener("keydown", (e) => { keys[e.code] = true; });
addEventListener("keyup", (e) => { keys[e.code] = false; });
const stick = { x: 0, y: 0, id: null };
const look = { id: null, x: 0, y: 0, moved: 0, t: 0 };
const stickEl = document.getElementById("stick"), knob = document.getElementById("knob");
function stickUpdate(e) {
  const r = stickEl.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const L = Math.hypot(dx, dy), max = 50; if (L > max) { dx *= max / L; dy *= max / L; }
  knob.style.left = 40 + dx + "px"; knob.style.top = 40 + dy + "px";
  stick.x = dx / max; stick.y = dy / max;
}
stickEl.addEventListener("pointerdown", (e) => { stick.id = e.pointerId; stickEl.setPointerCapture(e.pointerId); stickUpdate(e); });
stickEl.addEventListener("pointermove", (e) => { if (e.pointerId === stick.id) stickUpdate(e); });
const stickEnd = (e) => { if (e.pointerId === stick.id) { stick.id = null; stick.x = stick.y = 0; knob.style.left = knob.style.top = "40px"; } };
stickEl.addEventListener("pointerup", stickEnd); stickEl.addEventListener("pointercancel", stickEnd);

canvas.addEventListener("pointerdown", (e) => {
  if (look.id !== null) return;
  look.id = e.pointerId; look.x = e.clientX; look.y = e.clientY; look.moved = 0; look.t = performance.now();
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", (e) => {
  if (e.pointerId !== look.id) return;
  const dx = e.clientX - look.x, dy = e.clientY - look.y; look.x = e.clientX; look.y = e.clientY;
  look.moved += Math.abs(dx) + Math.abs(dy);
  yaw -= dx * 0.005; pitch = Math.max(-1.3, Math.min(1.3, pitch - dy * 0.005));
});
canvas.addEventListener("pointerup", (e) => {
  if (e.pointerId !== look.id) return; look.id = null;
  if (look.moved < 8 && performance.now() - look.t < 500) pick(e.clientX, e.clientY);
});
canvas.addEventListener("pointercancel", (e) => { if (e.pointerId === look.id) look.id = null; });

const card = document.getElementById("card");
const ray = new THREE.Raycaster();
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function pick(cx, cy) {
  ray.setFromCamera(new THREE.Vector2(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1), camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  if (!hit) { card.style.display = "none"; return; }
  const i = hit.object.userData.info;
  const pct = (v) => (v == null ? "—" : Math.round(v * 100) + "%");
  const ratios = i.shape_ratio != null ? `<div>形 <b>${pct(i.shape_ratio)}</b> ／ 根拠 <b>${pct(i.evidence_ratio)}</b></div>` : "";
  const hm = hit.object, hmt = Array.isArray(hm.material) ? null : hm.material;
  const where = (hmt && hmt.userData.face) || (() => { for (let p = hm; p; p = p.parent) if (p.userData.face || p.userData.part) return p.userData.face || p.userData.part; return null; })();
  const ev = evidenceOf(hm, (hm.userData.origMat && !Array.isArray(hm.userData.origMat)) ? hm.userData.origMat : hmt);
  const here = ev ? `<div class="k">ここ（${esc(where || "本体")}）：${esc(ev)}</div>` : "";
  card.innerHTML = `<h3>${esc(i.name || "（名前未確認）")}</h3><div class="k">id：${esc(i.id)}</div>` +
    (i.grounded
      ? ratios + `<div>measured ${i.measured} ／ estimated ${i.estimated} ／ <b>unknown ${i.unknown}</b></div>` + here
      : `<div>未測（PLATEAU の箱。高さ ${i.height ?? "不明"} m は参考値）</div>`);
  card.style.display = "block";
}

const dbg = { up: 0 };
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.1);
  let f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) - stick.y;
  let s = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + stick.x;
  const L = Math.hypot(f, s); if (L > 1) { f /= L; s /= L; }
  if (fixed && L > 0) fixed = null;                    // 歩き出したら固定を外す
  const sp = SPEED * (keys.ShiftLeft ? 2.5 : 1) * dt;
  player.x += (-Math.sin(yaw) * f + Math.cos(yaw) * s) * sp;
  player.z += (-Math.cos(yaw) * f - Math.sin(yaw) * s) * sp;
  if (fixed) camera.position.copy(fixed);
  else camera.position.set(player.x, groundAt(player.x, player.z) + EYE + dbg.up, player.z);
  camera.rotation.set(pitch, yaw, 0);
  sunFollow(camera.position);
  roomLight.intensity = roomBoxes.some((bx) => bx.containsPoint(camera.position)) ? qnum("room", 1.6) : 0;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
await envReady;
document.getElementById("loading").style.display = "none";
frame();
window.__campus = { dbg, camera, player, place, pick, centers, renderer, scene, sun, setEvidence };   // 動作確認用
</script>
</body>
</html>
