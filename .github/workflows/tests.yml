# pytest を ubuntu で回す。Blender・ブラウザ（headless Edge）・GPU が要るテストは印で外す
# （印の表は tests/conftest.py、登録は pyproject.toml の markers）。
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 依存を入れる
        # pyproject の依存（numpy・pillow・pytest）に加え、recorder が中で import する CPU だけの物
        # （cv2・shapely・pyproj・requests・pycolmap）。torch・Blender・ブラウザは入れない
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" opencv-python-headless shapely pyproj requests pycolmap

      - name: pytest（Blender・ブラウザ・GPU を除く）
        run: python -X utf8 -m pytest -m "not blender and not browser and not gpu" -q -ra
